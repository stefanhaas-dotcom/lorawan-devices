name: AS2-LB2 - Ultrasonic Water Level Sensor
description: This autonomous station provides continuous, reliable, and maintenance-free monitoring of water levels in both flowing and standing bodies of water using ultrasonic sensing. To continuously capture the exact water level, the station can be calibrated to a reference height (e.g. gauge zero point) after mounting. It measures height differences of up to 10 m with an accuracy of 5 mm (at 5 m) / 10 mm (at 10 m), is mounted above the body of water, and is powered by a battery and solar cell for fully maintenance-free operation.

# Hardware versions (optional)
hardwareVersions:
  - version: '1.0'
    numeric: 1

# Firmware versions (at least one is mandatory)
firmwareVersions:
  - # Firmware version
    version: '1.0'
    numeric: 1
    # Supported hardware versions (optional)
    hardwareVersions:
      - '1.0' # Must refer to hardwareVersions declared above
    # LoRaWAN Device Profiles per region
    # Supported regions: EU863-870, US902-928, AU915-928, AS923, CN779-787, EU433, CN470-510, KR920-923, IN865-867, RU864-870
    features:
      - transmission interval
    profiles:
       EU863-870:
        id: as2-lb2-profile-eu868
        lorawanCertified: false
        codec: evrlast-device-codec

